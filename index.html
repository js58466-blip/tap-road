
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rainbow Digital Clock</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #080810;
    font-family: monospace;
  }
  h1 {
    background: linear-gradient(90deg, red, orange, yellow,
      lime, cyan, blue, violet, red);
    background-size: 300%;
    color: transparent;
    background-clip: text;
    animation: rainbow 5s linear infinite;
  }
  #clock {
    font-size: clamp(45px, 12vw, 130px);
    font-weight: bold;
    background: linear-gradient(90deg, red, orange, yellow,
      lime, cyan, blue, violet);
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px #8a2be2);
    font-variant-numeric: tabular-nums;
  }
  @keyframes rainbow {
    to { background-position: 300% center; }
  }
</style>
</head>
<body>
<h1>🌈 MICHIGAN CLOCK</h1>
<div id="clock">00:00:00</div>
<script>
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Detroit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    }).format(now);
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
